<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | Community Discussion Forum</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet" href="css/profile.css">

</head>

<body>

<header>

<div class="logo">

<i class="fa-solid fa-comments"></i>

<h2>Community Discussion Forum</h2>

</div>

<nav>

<a href="dashboard.html">
<i class="fa-solid fa-house"></i> Dashboard
</a>

<a href="create-post.html">
<i class="fa-solid fa-pen"></i> Create Post
</a>

<a href="discussions.html">
<i class="fa-solid fa-comments"></i> Discussions
</a>

<a href="profile.html" class="active">
<i class="fa-solid fa-user"></i> Profile
</a>

</nav>

</header>

<section class="profile-container">

<div class="profile-card">

<div class="avatar">

<i class="fa-solid fa-user"></i>

</div>

<h1>My Profile</h1>

<p class="subtitle">
Manage your account information
</p>

<div class="info">

<div class="info-box">

<i class="fa-solid fa-user"></i>

<div>

<h4>Full Name</h4>

<p id="userName">Loading...</p>

</div>

</div>

<div class="info-box">

<i class="fa-solid fa-envelope"></i>

<div>

<h4>Email Address</h4>

<p id="userEmail">Loading...</p>

</div>

</div>

</div>

<div class="stats">

<div>

<h2>25</h2>

<p>Posts</p>

</div>

<div>

<h2>120</h2>

<p>Discussions</p>

</div>

<div>

<h2>2026</h2>

<p>Joined</p>

</div>

</div>

<div class="buttons">

<a href="dashboard.html" class="btn">
Dashboard
</a>

<button id="logoutBtn">
Logout
</button>

</div>

</div>

</section>

<script src="js/profile.js"></script>

</body>

</html>
