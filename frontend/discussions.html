<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discussions | Community Discussion Forum</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet" href="css/discussions.css">

</head>

<body>

<header>

<div class="logo">

<i class="fa-solid fa-comments"></i>

<h2>Community Discussion Forum</h2>

</div>

<nav>

<a href="dashboard.html">
<i class="fa-solid fa-house"></i> Dashboard
</a>

<a href="create-post.html">
<i class="fa-solid fa-square-plus"></i> Create Post
</a>

<a href="discussions.html" class="active">
<i class="fa-solid fa-comments"></i> Discussions
</a>

<a href="profile.html">
<i class="fa-solid fa-user"></i> Profile
</a>

<a href="index.html">
<i class="fa-solid fa-right-from-bracket"></i> Logout
</a>

</nav>

</header>

<section class="hero">

<h1>Community Discussions</h1>

<p>
Explore ideas, ask questions and engage with other members.
</p>

</section>

<section class="search-section">

<div class="search-box">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="text"
id="searchInput"
placeholder="Search discussions...">

</div>

</section>

<section class="stats">

<div class="stat-card">

<i class="fa-solid fa-file-lines"></i>

<h2 id="totalPosts">0</h2>

<p>Total Posts</p>

</div>

<div class="stat-card">

<i class="fa-solid fa-users"></i>

<h2>500+</h2>

<p>Community Members</p>

</div>

<div class="stat-card">

<i class="fa-solid fa-layer-group"></i>

<h2 id="totalCategories">5</h2>

<p>Categories</p>

</div>

</section>

<section>

<div id="discussionContainer" class="discussion-grid">

</div>

</section>

<footer>

<p>© 2026 Community Discussion Forum</p>

</footer>

<script src="js/discussions.js"></script>

</body>
</html>
