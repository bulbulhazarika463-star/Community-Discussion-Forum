<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Discussions</title>

    <link rel="stylesheet" href="css/discussions.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

    <h1>Community Discussion Forum</h1>

    <nav>

        <a href="dashboard.html">Dashboard</a>

        <a href="create-post.html">Create Post</a>

        <a href="discussions.html" class="active">Discussions</a>

        <a href="profile.html">Profile</a>

        <a href="index.html">Logout</a>

    </nav>

</header>


<section class="hero">

    <h2>
        <i class="fa-solid fa-comments"></i>
        Community Discussions
    </h2>

    <p>
        Share your knowledge, ask questions, and connect with other members.
    </p>

</section>


<section class="search-section">

    <input
        type="text"
        id="searchInput"
        placeholder="Search discussions...">

</section>


<section id="discussionContainer">

    <!-- Posts will appear here -->

</section>


<section class="stats">

    <div class="stat-card">

        <i class="fa-solid fa-file-lines"></i>

        <h3 id="totalPosts">0</h3>

        <p>Posts</p>

    </div>

    <div class="stat-card">

        <i class="fa-solid fa-users"></i>

        <h3 id="totalMembers">0</h3>

        <p>Members</p>

    </div>

    <div class="stat-card">

        <i class="fa-solid fa-layer-group"></i>

        <h3 id="totalCategories">0</h3>

        <p>Categories</p>

    </div>

</section>


<footer>

    <p>

        © 2026 Community Discussion Forum. All Rights Reserved.

    </p>

</footer>

<script src="js/discussions.js"></script>

</body>

</html>
